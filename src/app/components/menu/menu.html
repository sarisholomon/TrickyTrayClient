<div class="card flex justify-center p-3">
    <p-menu [model]="items()" styleClass="main-sidebar border-none shadow-md">
        
        <ng-template #start>
            <div class="flex flex-col items-center py-7 px-5">
                <div class="logo-wrapper mb-3">
                    <svg width="34" height="34" viewBox="0 0 31 33" fill="none">
                        <path d="M15.1934 0L0.0391235 5.38288L2.35052 25.3417L15.1934 32.427L28.0364 25.3417L30.3478 5.38288L15.1934 0Z" fill="#6366F1" />
                    </svg>
                </div>
                <div class="text-center">
                    <h2 class="text-xl font-bold text-slate-800 m-0 tracking-tight">מכירה <span class="text-indigo-600">סינית</span></h2>
                    <p class="text-[12px] text-slate-400 font-medium mt-1">ניהול מכירות חכם</p>
                </div>
            </div>
            <div class="divider mx-6 mb-2"></div>
        </ng-template>

        <ng-template #submenuheader let-item>
            <div class="px-6 py-2">
                <span class="text-[11px] font-bold uppercase tracking-wider text-slate-300">{{ item.label }}</span>
            </div>
        </ng-template>

        <ng-template #item let-item>
            <div class="px-3 mb-0.5">
                <a pRipple class="nav-item flex items-center px-4 py-2.5 cursor-pointer transition-all rounded-lg" 
                   [routerLink]="item.routerLink" [class]="item.linkClass">
                    <span [class]="item.icon" class="text-lg opacity-60"></span>
                    <span class="mr-3.5 font-medium text-[14px]">{{ item.label }}</span>
                    <p-badge *ngIf="item.badge" class="badge mr-auto" [value]="item.badge" />
                </a>
            </div>
        </ng-template>

        <ng-template #end>
            <div *ngIf="userSignal() as currentUser" class="mt-auto px-3 pb-4">
                <div class="divider mb-4 mx-3"></div>
                <div class="user-profile flex items-center px-3 py-2 rounded-xl hover:bg-slate-50 transition-all cursor-pointer">
                    <p-avatar [label]="(currentUser.firstName?.charAt(0)?.toUpperCase())" 
                              shape="circle" 
                              styleClass="bg-indigo-500 text-white text-sm font-bold w-9 h-9">
                    </p-avatar>
                    <div class="flex flex-col text-right mr-3 overflow-hidden">
                        <span class="font-bold text-slate-700 text-[13.5px] truncate leading-tight">{{ currentUser.firstName }}</span>
                        <span class="text-[11.5px] text-slate-400 truncate">{{ currentUser.email }}</span>
                    </div>
                    <i class="pi pi-chevron-down mr-auto text-[10px] text-slate-300"></i>
                </div>
            </div>
        </ng-template>
    </p-menu>
</div>
