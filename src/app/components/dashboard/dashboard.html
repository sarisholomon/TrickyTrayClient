<div [style]="{'padding': '2rem', 'background-color': '#f8fafc', 'min-height': '100vh'}" dir="rtl">
    
    <div [style]="{'margin-bottom': '2.5rem'}">
        <h2 [style]="{'margin': '0', 'font-size': '1.8rem', 'color': '#1e293b', 'font-weight': '800'}">לוח בקרה</h2>
        <p [style]="{'margin': '0.2rem 0 0 0', 'color': '#64748b', 'font-size': '1rem'}">ריכוז נתונים וביצועים</p>
    </div>

    <div [style]="{'display': 'grid', 'grid-template-columns': 'repeat(auto-fit, minmax(220px, 1fr))', 'gap': '1.5rem', 'margin-bottom': '2.5rem'}">
        
        <div *ngFor="let stat of [
            {label: 'הכנסות', value: '₪' + totalIncome(), icon: 'pi-money-bill', color: '#16a34a', bg: '#f0fdf4'},
            {label: 'כרטיסים נמכרו', value: ticketsSold(), icon: 'pi-ticket', color: '#ea580c', bg: '#fff7ed'},
            {label: 'תורמים', value: totalDonors(), icon: 'pi-users', color: '#2563eb', bg: '#eff6ff'},
            {label: 'מתנות', value: totalGifts(), icon: 'pi-gift', color: '#7c3aed', bg: '#f5f3ff'}
        ]" (click)="handleCardClick(stat.label)"
        class="stat-card"
        [style]="{'background': 'white', 'padding': '1.5rem', 'border-radius': '16px', 'border': '1px solid #e2e8f0', 'display': 'flex', 'align-items': 'center', 'gap': '1.25rem', 'cursor': 'pointer'}">
            
            <div [style]="{'background': stat.bg, 'color': stat.color, 'width': '50px', 'height': '50px', 'border-radius': '12px', 'display': 'flex', 'align-items': 'center', 'justify-content': 'center'}">
                <i class="pi {{stat.icon}}" style="font-size: 1.25rem;"></i>
            </div>
            <div>
                <span [style]="{'display': 'block', 'color': '#64748b', 'font-size': '0.85rem', 'font-weight': '600'}">{{stat.label}}</span>
                <span [style]="{'font-size': '1.5rem', 'font-weight': '800', 'color': '#1e293b'}">{{stat.value}}</span>
            </div>
        </div>
    </div>

    <div [style]="{'display': 'grid', 'grid-template-columns': 'repeat(auto-fit, minmax(400px, 1fr))', 'gap': '2rem'}">
        
        <div [style]="{'background': 'white', 'border-radius': '16px', 'padding': '1.5rem', 'border': '1px solid #e2e8f0'}">
            <h3 [style]="{'margin': '0 0 1.5rem 0', 'font-size': '1.1rem', 'color': '#1e293b', 'font-weight': '800'}">מתנות מובילות</h3>
            
            <div *ngFor="let gift of topGifts(); let i = index" 
            class="gift-list-item"
                 [style]="{'display': 'flex', 'align-items': 'center', 'gap': '1rem', 'padding': '1rem', 'margin-bottom': '0.75rem', 'border-radius': '12px', 'border': '1px solid #f1f5f9'}">
                
                <div [style]="{'font-weight': '900', 'color': '#cbd5e1', 'font-size': '1.1rem', 'width': '1.5rem'}">{{ i + 1 }}</div>

                <div [style]="{'width': '55px', 'height': '55px', 'border-radius': '8px', 'overflow': 'hidden', 'border': '1px solid #e2e8f0'}">
                    <img [src]="gift.imgUrl ? 'https://localhost:7260' + gift.imgUrl : 'https://primefaces.org/cdn/primeng/images/demo/product/bamboo-watch.jpg'" 
                         [style]="{'width': '100%', 'height': '100%', 'object-fit': 'cover'}" />
                </div>

                <div [style]="{'flex': '1'}">
                    <div [style]="{'font-weight': '700', 'color': '#334155'}">{{ gift.name }}</div>
                    <div [style]="{'color': '#94a3b8', 'font-size': '0.85rem'}">{{ gift.ticketsSold }} כרטיסים נמכרו</div>
                </div>

                <div [style]="{'font-weight': '800', 'color': '#4f46e5'}">₪{{ gift.ticketsSold * 10 }}</div>
            </div>
        </div>

        <div [style]="{'background': 'white', 'border-radius': '16px', 'padding': '1.5rem', 'border': '2px solid #eef2ff', 'display': 'flex', 'flex-direction': 'column'}">
            <h3 [style]="{'margin': '0 0 1.5rem 0', 'font-size': '1.1rem', 'color': '#1e293b', 'font-weight': '800'}">סטטוס הגרלה</h3>
            
            <div [style]="{'flex': '1', 'display': 'flex', 'flex-direction': 'column', 'justify-content': 'center', 'align-items': 'center', 'gap': '1rem', 'padding': '2rem 0'}">
                <div [style]="{'width': '80px', 'height': '80px', 'background': '#eef2ff', 'border-radius': '50%', 'display': 'flex', 'align-items': 'center', 'justify-content': 'center'}">
                    <i class="pi pi-check-circle" style="font-size: 2.5rem; color: #4f46e5;"></i>
                </div>
                <div [style]="{'text-align': 'center'}">
                    <div [style]="{'font-weight': '800', 'color': '#1e293b', 'font-size': '1.2rem'}">המערכת מוכנה</div>
                    <div [style]="{'color': '#64748b'}">{{ totalGifts() }} מתנות ממתינות להגרלה</div>
                </div>
            </div>

            <p-button 
                label="מעבר למסך הגרלה" 
                icon="pi pi-trophy" 
                (click)="goToRaffle()"
                styleClass="w-full bg-indigo-600 border-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-sm"
                [style]="{'width': '100%'}">
            </p-button>
        </div>
    </div>
</div>
