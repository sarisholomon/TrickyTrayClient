
<div class="dashboard-wrapper" dir="rtl">
    <div class="animated-bg"></div>
    
    <div class="header-section">
        <div class="header-icon">
            <i class="pi pi-chart-line"></i>
        </div>
        <div>
            <h2 class="main-title">לוח בקרה</h2>
            <p class="sub-title">ריכוז נתונים וביצועים בזמן אמת</p>
        </div>
    </div>

    <div class="stats-grid">
        <div *ngFor="let stat of [
            {label: 'הכנסות', value: '₪' + totalIncome(), icon: 'pi-money-bill', color: '#16a34a', bg: '#f0fdf4'},
            {label: 'כרטיסים נמכרו', value: ticketsSold(), icon: 'pi-ticket', color: '#ea580c', bg: '#fff7ed'},
            {label: 'תורמים', value: totalDonors(), icon: 'pi-users', color: '#2563eb', bg: '#eff6ff'},
            {label: 'מתנות', value: totalGifts(), icon: 'pi-gift', color: '#7c3aed', bg: '#f5f3ff'}
        ]" 
        class="stat-card"
        (click)="handleCardClick(stat.label)">
            
            <div class="icon-container" [style.background]="stat.bg" [style.color]="stat.color">
                <i class="pi {{stat.icon}}"></i>
            </div>
            <div class="stat-info">
                <span class="stat-label">{{stat.label}}</span>
                <span class="stat-value">{{stat.value}}</span>
            </div>
        </div>
    </div>

    <div class="main-content-grid">
        
        <div class="content-card">
            <h3 class="card-title">מתנות מובילות</h3>
            
            <div class="gift-list">
                <div *ngFor="let gift of topGifts(); let i = index" class="gift-item">
                    <div class="gift-rank">{{ i + 1 }}</div>

                    <div class="gift-image-wrapper">
                        <img [src]="gift.imgUrl ? 'https://localhost:7260' + gift.imgUrl : 'https://primefaces.org/cdn/primeng/images/demo/product/bamboo-watch.jpg'" 
                             alt="{{ gift.name }}" />
                    </div>

                    <div class="gift-details">
                        <div class="gift-name">{{ gift.name }}</div>
                        <div class="gift-count">{{ gift.ticketsSold }} כרטיסים נמכרו</div>
                    </div>

                    <div class="gift-revenue">₪{{ gift.ticketsSold * price }}</div>
                </div>
            </div>
        </div>

        <div class="content-card status-card">
            <h3 class="card-title">סטטוס הגרלה</h3>
            
            <div class="status-content">
                <div class="status-icon-circle">
                    <i class="pi pi-check-circle"></i>
                </div>
                <div class="status-text">
                    <div class="status-main">המערכת מוכנה</div>
                    <div class="status-sub">{{ totalGifts() }} מתנות ממתינות להגרלה</div>
                </div>
            </div>

            <p-button 
                label="מעבר למסך הגרלה" 
                icon="pi pi-trophy" 
                (click)="goToRaffle()"
                styleClass="raffle-btn">
            </p-button>
        </div>
    </div>
</div>
