<div  class="flex items-center justify-center min-h-screen p-4" dir="rtl" [style]="{'display': 'flex', 'align-items': 'center', 'justify-content': 'center', 'background-color': '#f8fafc', 'min-height': '100vh', 'font-family': 'sans-serif'}">
    
    <div [style]="{'width': '100%', 'max-width': '500px', 'background': 'white', 'padding': '2.5rem', 'border-radius': '1.25rem', 'box-shadow': '0 10px 25px -5px rgba(0, 0, 0, 0.1)', 'border': '1px solid #e2e8f0'}">
        
        <div [style]="{'text-align': 'center', 'margin-bottom': '2rem'}">
            <div [style]="{'display': 'inline-flex', 'align-items': 'center', 'justify-content': 'center', 'width': '60px', 'height': '60px', 'background': '#eef2ff', 'border-radius': '50%', 'margin-bottom': '1rem'}">
                <i class="pi pi-user-plus" style="font-size: 1.5rem; color: #4f46e5;"></i>
            </div>
            <h2 [style]="{'margin': '0', 'font-size': '1.75rem', 'color': '#1e293b', 'font-weight': '800'}">יצירת חשבון חדש</h2>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onRegister()" [style]="{'display': 'flex', 'flex-direction': 'column', 'gap': '1.25rem'}">
            
            <div [style]="{'display': 'flex', 'gap': '1rem'}">
                <div [style]="{'flex': '1', 'display': 'flex', 'flex-direction': 'column', 'gap': '0.5rem'}">
                    <label [style]="{'font-size': '0.875rem', 'font-weight': '700', 'color': '#475569'}">שם פרטי</label>
                    <input pInputText formControlName="firstName" placeholder="ישראל" 
                           [style]="{'width': '100%', 'padding': '0.75rem', 'border-radius': '0.6rem'}" />
                </div>
                <div [style]="{'flex': '1', 'display': 'flex', 'flex-direction': 'column', 'gap': '0.5rem'}">
                    <label [style]="{'font-size': '0.875rem', 'font-weight': '700', 'color': '#475569'}">שם משפחה</label>
                    <input pInputText formControlName="lastName" placeholder="ישראלי" 
                           [style]="{'width': '100%', 'padding': '0.75rem', 'border-radius': '0.6rem'}" />
                </div>
            </div>

            <div [style]="{'display': 'flex', 'flex-direction': 'column', 'gap': '0.5rem'}">
                <label [style]="{'font-size': '0.875rem', 'font-weight': '700', 'color': '#475569'}">כתובת אימייל</label>
                <input pInputText formControlName="email" placeholder="example@mail.com" 
                       [style]="{'width': '100%', 'padding': '0.75rem', 'border-radius': '0.6rem'}" />
            </div>

            <div [style]="{'display': 'flex', 'flex-direction': 'column', 'gap': '0.5rem'}">
                <label [style]="{'font-size': '0.875rem', 'font-weight': '700', 'color': '#475569'}">מספר טלפון</label>
                <p-inputMask 
                    mask="099-9999999" 
                    formControlName="phone" 
                    placeholder="050-0000000" 
                    styleClass="w-full" 
                    inputStyleClass="w-full"
                    [style]="{'width': '100%'}">
                </p-inputMask>
            </div>

            <div [style]="{'display': 'flex', 'flex-direction': 'column', 'gap': '0.5rem'}">
                <label [style]="{'font-size': '0.875rem', 'font-weight': '700', 'color': '#475569'}">סיסמה</label>
                <p-password 
                    formControlName="password" 
                    [toggleMask]="true" 
                    styleClass="w-full" 
                    inputStyleClass="w-full" 
                    [style]="{'width': '100%'}"
                    placeholder="לפחות 6 תווים">
                </p-password>
            </div>

            <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage"></p-message>

            <p-button 
                label="הרשמה למערכת" 
                type="submit" 
                [disabled]="registerForm.invalid" 
                [style]="{'width': '100%', 'background': '#4f46e5', 'border': 'none', 'padding': '1rem', 'border-radius': '0.75rem', 'font-weight': '700', 'color': 'white'}">
            </p-button>

        </form>
        
        <div [style]="{'text-align': 'center', 'margin-top': '1.5rem', 'padding-top': '1.5rem', 'border-top': '1px solid #f1f5f9'}">
            <span [style]="{'color': '#64748b', 'font-size': '0.875rem'}">כבר יש לך חשבון? </span>
            <a [style]="{'color': '#4f46e5', 'font-weight': '700', 'cursor': 'pointer', 'text-decoration': 'none'}" (click)="router.navigate(['/login'])">התחברו כאן</a>
        </div>
    </div>
</div>
