<div class="card p-4">
    <div class="flex justify-start mb-4" *ngIf="authService.isAdmin()">
        <p-button (click)="showDialog()" label="הוספת מתנה חדשה" icon="pi pi-plus" severity="success" />
    </div>

    <p-dataview #dv [value]="gifts()" [layout]="layout">
        <ng-template #header>
            <div class="flex justify-end mb-4">
                <p-selectbutton [(ngModel)]="layout" [options]="options" [allowEmpty]="false">
                    <ng-template #item let-item>
                        <i class="pi" [ngClass]="{ 
                            'pi-bars': item.value === 'list', 
                            'pi-table': item.value === 'grid' 
                        }"></i>
                    </ng-template>
                </p-selectbutton>
            </div>
        </ng-template>

        <ng-template #list let-items>
            <div *ngFor="let item of items; let first = first">
                <div class="flex flex-col sm:flex-row sm:items-center p-6 gap-4"
                    [ngClass]="{ 'border-t border-gray-200': !first }">

                    <div class="md:w-40 relative">
                        <img class="block mx-auto rounded w-full"
                            [src]="item.imgUrl ? 'https://localhost:7260' + item.imgUrl : 'https://primefaces.org/cdn/primeng/images/demo/product/bamboo-watch.jpg'"
                            [alt]="item.name" />
                    </div>

                    <div class="flex flex-col md:flex-row justify-between md:items-center flex-1 gap-6">
                        <div class="flex flex-row md:flex-col justify-between items-start gap-2">
                            <div>
                                <span class="font-medium text-gray-500 text-sm">{{ item.category }}</span>
                                <div class="text-lg font-medium mt-2">{{ item.name }}</div>
                            </div>
                        </div>
                        <div class="flex flex-col md:items-end gap-8">
                            <span class="text-xl font-semibold">{{ price | currency: 'USD' }}</span>
                            <div class="flex flex-row-reverse md:flex-row gap-2">
                                <button *ngIf="this.authService.isAdmin()" (click)="showDialog(item)" pButton icon="pi pi-pencil" [outlined]="true" class="p-button-rounded"></button>
                                <button *ngIf="this.authService.isAdmin()" (click)="deleteGift(item.id)" pButton icon="pi pi-trash" severity="danger" [outlined]="true" class="p-button-rounded"></button>
                                
                                <button *ngIf="!this.authService.isAdmin()" pButton icon="pi pi-shopping-cart" label="הוספה לסל"
                                    class="flex-auto md:flex-initial whitespace-nowrap"
                                    (click)="addToCart(item.id)"></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </ng-template>

        <ng-template #grid let-items>
            <div class="grid grid-cols-12 gap-4">
                <div *ngFor="let item of items" class="col-span-12 sm:col-span-6 md:col-span-4 xl:col-span-4 p-2">
                    <div class="p-6 border border-gray-200 bg-white rounded-lg flex flex-col shadow-md hover:shadow-lg transition-shadow duration-300">
                        <div class="bg-gray-50 flex justify-center rounded p-4 relative mb-4">
                            <div class="relative mx-auto">
                                <img class="rounded w-full"
                                    [src]="item.imgUrl ? 'https://localhost:7260' + item.imgUrl : 'https://primefaces.org/cdn/primeng/images/demo/product/bamboo-watch.jpg'"
                                    [alt]="item.name" style="max-width: 200px" />
                            </div>
                        </div>

                        <div class="pt-2">
                            <div class="flex flex-row justify-between items-start gap-2">
                                <div>
                                    <span class="font-medium text-gray-500 text-sm">{{ item.category }}</span>
                                    <div class="text-lg font-medium mt-1">{{ item.name }}</div>
                                </div>
                                <button *ngIf="this.authService.isAdmin()" (click)="showDialog(item)" pButton icon="pi pi-pencil" [rounded]="true" [text]="true"></button>
                            </div>
                            <div class="flex flex-col gap-6 mt-6">
                                <span class="text-2xl font-semibold">{{ price | currency: 'USD' }}</span>
                                <div class="flex gap-2">
                                    <button pButton icon="pi pi-shopping-cart" label="הוספה לסל"
                                        (click)="addToCart(item.id)" class="flex-auto whitespace-nowrap"></button>
                                    <button pButton icon="pi pi-heart" [outlined]="true"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </ng-template>
    </p-dataview>
</div>

<p-dialog [header]="isEditMode ? 'עריכת פרטי מתנה' : 'הוספת מתנה חדשה'" 
          [(visible)]="visible" 
          [style]="{ width: '30rem' }" 
          [modal]="true">
    
    <div class="flex flex-col gap-4 py-4">
        <div class="flex flex-col gap-2">
            <label for="name" class="font-semibold">שם המתנה *</label>
            <input pInputText id="name" [(ngModel)]="currentGift.name" class="w-full" />
        </div>
        
        <div class="flex flex-col gap-2">
            <label for="description" class="font-semibold">תיאור *</label>
            <input pInputText id="description" [(ngModel)]="currentGift.description" class="w-full" />
        </div>

        <div class="flex flex-col gap-2">
    <label class="font-semibold">קטגוריה *</label>
    <p-select 
        [options]="categories()" 
        [(ngModel)]="currentGift.categoryId" 
        optionLabel="name" 
        optionValue="id" 
        placeholder="בחר קטגוריה"
        class="w-full">
    </p-select>
</div>

<div class="flex flex-col gap-2">
    <label class="font-semibold">תורם *</label>
    <p-select 
        [options]="donors()" 
        [(ngModel)]="currentGift.donorId" 
        optionLabel="name" 
        optionValue="id" 
        placeholder="בחר תורם"
        class="w-full">
    </p-select>
</div>

        <div class="flex flex-col gap-2 border-t pt-4 mt-2">
            <label class="font-semibold">העלאת תמונה</label>
            <input type="file" (change)="onFileSelected($event)" accept="image/*" class="block w-full text-sm" />
            <small class="text-gray-500">אם לא ייבחר קובץ, יישמר הערך הקיים (או ריק).</small>
        </div>
    </div>

    <div class="flex justify-end gap-2 mt-4">
        <p-button label="ביטול" severity="secondary" (click)="visible = false" [outlined]="true" />
        <p-button [label]="isEditMode ? 'עדכן' : 'שמור'" (click)="saveGift()" icon="pi pi-check" />
    </div>
</p-dialog>
