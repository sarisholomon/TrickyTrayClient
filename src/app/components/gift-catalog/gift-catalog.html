<div class="card p-5" dir="rtl">
    <p-toast></p-toast>
    <p-confirmdialog></p-confirmdialog>

    <div class="flex justify-between items-start mb-6">
        <div class="flex flex-col gap-1">
            <h2 class="m-0 text-2xl font-bold text-slate-800">ניהול מתנות</h2>
            <span class="text-sm font-medium text-slate-500" *ngIf="gifts()">{{gifts().length}} מתנות במערכת</span>
        </div>
        
        <div class="flex items-center gap-3" *ngIf="authService.isAdmin()">
            <p-button (click)="random()" label="ביצוע הגרלה" icon="pi pi-sparkles" [outlined]="true" severity="secondary"></p-button>
            
            <p-button 
                (click)="showDialog()" 
                label="הוספת מתנה" 
                icon="pi pi-plus" 
                styleClass="bg-indigo-600 border-indigo-600 hover:bg-indigo-700 text-white">
            </p-button>
        </div>
    </div>

    <div class="flex justify-end mb-4">
        <p-selectbutton [(ngModel)]="layout" [options]="options" [allowEmpty]="false">
            <ng-template #item let-item>
                <i class="pi" [ngClass]="{ 'pi-bars': item.value === 'list', 'pi-table': item.value === 'grid' }"></i>
            </ng-template>
        </p-selectbutton>
    </div>

    <p-dataview #dv [value]="gifts()" [layout]="layout" [paginator]="true" [rows]="6" [showCurrentPageReport]="true" currentPageReportTemplate="מציג {first} עד {last} מתוך {totalRecords} מתנות">
        
        <ng-template #list let-items>
            <div class="flex flex-col w-full border border-slate-200 rounded-lg overflow-hidden bg-white">
                <div *ngFor="let item of items; let first = first" 
                     class="flex flex-col md:flex-row items-center p-4 gap-6 w-full hover:bg-slate-50 transition-colors"
                     [ngClass]="{ 'border-t border-slate-200': !first }">
                    
                    <div class="w-32 h-24 flex-shrink-0 bg-white border border-slate-100 rounded flex justify-center items-center p-2">
                        <img [src]="item.imgUrl ? 'https://localhost:7260' + item.imgUrl : 'https://primefaces.org/cdn/primeng/images/demo/product/bamboo-watch.jpg'" 
                             [alt]="item.name" 
                             class="max-w-full max-h-full object-contain" />
                    </div>

             <div class="flex-1 flex flex-col justify-center items-start gap-2">
    <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-full">{{ item.category }}</span>
    <div class="text-lg font-bold text-slate-800">{{ item.name }}</div>
    
    <div *ngIf="item.winnerName && item.winnerName.trim() !== ''" class="text-xs font-medium text-amber-600 bg-amber-50 px-2 py-1 rounded-full flex items-center gap-1">
        <i class="pi pi-crown"></i> זוכה: {{ item.winnerName }}
    </div>
</div>

                    <div class="flex flex-col items-end justify-center gap-3">
                        <span class="text-xl font-bold text-slate-800">{{ price | currency: 'USD' }}</span>
                        
                        <div class="flex gap-2">
                            <ng-container *ngIf="authService.isAdmin() && item.winnerEmail===null">
                                <p-button (click)="showDialog(item)" icon="pi pi-pencil" [outlined]="true" [rounded]="true" severity="secondary"></p-button>
                                <p-button *ngIf="item.canDelete" (click)="deleteGift(item.id)" icon="pi pi-trash" severity="danger" [outlined]="true" [rounded]="true"></p-button>
                            </ng-container>
                            
                            <p-button *ngIf="!authService.isAdmin() && item.winnerEmail===null" 
                                      icon="pi pi-shopping-cart" 
                                      label="לסל" 
                                      (click)="addToCart(item.id)" 
                                      styleClass="bg-indigo-600 border-indigo-600 hover:bg-indigo-700 text-white">
                            </p-button>
                        </div>
                    </div>
                </div>
            </div>
        </ng-template>

        <ng-template #grid let-items>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <div *ngFor="let item of items" class="bg-white border border-slate-200 rounded-lg p-5 flex flex-col hover:shadow-md transition-shadow">
                    
                    <div class="h-40 bg-slate-50 rounded-md mb-4 flex justify-center items-center p-2 border border-slate-100">
                        <img [src]="item.imgUrl ? 'https://localhost:7260' + item.imgUrl : 'https://primefaces.org/cdn/primeng/images/demo/product/bamboo-watch.jpg'" 
                             [alt]="item.name" 
                             class="max-w-full max-h-full object-contain" />
                    </div>

                    <div class="flex flex-col flex-1 items-start gap-2">
                        <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-full">{{ item.category }}</span>
                        <div class="text-lg font-bold text-slate-800">{{ item.name }}</div>
                        <div *ngIf="item.winnerName" class="text-xs font-medium text-amber-600 bg-amber-50 px-2 py-1 rounded-full flex items-center gap-1">
                            <i class="pi pi-crown"></i> זוכה: {{ item.winnerName }}
                        </div>
                    </div>

                    <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between">
                        <span class="text-xl font-bold text-slate-800">{{ price | currency: 'USD' }}</span>
                        <div class="flex gap-2">
                            <ng-container *ngIf="authService.isAdmin() && item.winnerEmail===null">
                                <p-button (click)="showDialog(item)" icon="pi pi-pencil" [text]="true" [rounded]="true" severity="secondary"></p-button>
                                <p-button *ngIf="item.canDelete" (click)="deleteGift(item.id)" icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger"></p-button>
                            </ng-container>

                            <p-button *ngIf="!authService.isAdmin() && item.winnerEmail===null" 
                                      icon="pi pi-shopping-cart" 
                                      (click)="addToCart(item.id)" 
                                      styleClass="bg-indigo-600 border-indigo-600 hover:bg-indigo-700 text-white">
                            </p-button>
                        </div>
                    </div>
                </div>
            </div>
        </ng-template>
    </p-dataview>
</div>

<p-dialog [header]="isEditMode ? 'עריכת מתנה' : 'מתנה חדשה'" [(visible)]="visible" [style]="{ width: '400px' }" [modal]="true" styleClass="p-fluid">
    <div class="flex flex-col gap-4 mt-2" dir="rtl">
        <div>
            <label class="block font-bold mb-2">שם המתנה</label>
            <input pInputText [(ngModel)]="currentGift.name" />
        </div>
        <div>
            <label class="block font-bold mb-2">תיאור</label>
            <input pInputText [(ngModel)]="currentGift.description" />
        </div>
        <div>
            <label class="block font-bold mb-2">קטגוריה</label>
            <p-select [options]="categories()" [(ngModel)]="currentGift.categoryId" optionLabel="name" optionValue="id" placeholder="בחר"></p-select>
        </div>
        <div>
            <label class="block font-bold mb-2">תורם</label>
            <p-select [options]="donors()" [(ngModel)]="currentGift.donorId" optionLabel="name" optionValue="id" placeholder="בחר"></p-select>
        </div>
        <div class="border-t pt-3">
            <label class="block font-bold mb-2">תמונה</label>
            
            <div *ngIf="previewUrl" class="mb-2 relative w-fit">
                <img [src]="previewUrl" alt="תצוגה מקדימה" class="h-24 w-auto rounded border border-slate-200" />
                <button (click)="clearImage()" class="absolute -top-2 -right-2 bg-white rounded-full p-1 shadow-sm border border-slate-200 text-slate-500 hover:text-red-500">
                    <i class="pi pi-times text-xs"></i>
                </button>
            </div>
            
            <input [class.hidden]="previewUrl" type="file" (change)="onFileSelected($event)" accept="image/*" class="w-full text-sm" />
        </div>
    </div>
    <ng-template #footer>
        <div class="flex justify-end gap-2 w-full" dir="rtl">
            <p-button label="ביטול" severity="secondary" [text]="true" (click)="visible = false"></p-button>
            <p-button 
                [label]="isEditMode ? 'עדכן מתנה' : 'שמור מתנה'" 
                icon="pi pi-check" 
                (click)="saveGift()" 
                styleClass="bg-indigo-600 border-indigo-600 hover:bg-indigo-700 text-white">
            </p-button>
        </div>
    </ng-template>
</p-dialog>
