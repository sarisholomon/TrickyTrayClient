<div class="card" dir="rtl">
    <p-toast />
    
    <p-toolbar class="mb-6">
        <ng-template #start>
            <p-button label="הוספת תורם" icon="pi pi-plus" class="ml-2" (onClick)="openNew()" />
        </ng-template>
        <ng-template #end>
            <p-button label="ייצוא" icon="pi pi-upload" severity="secondary" (onClick)="dt.exportCSV()" />
        </ng-template>
    </p-toolbar>

    <p-table
        #dt
        [value]="donors"
        [rows]="10"
        [paginator]="true"
        [globalFilterFields]="['name', 'email', 'phoneNumber', 'giftsString']"
        [tableStyle]="{ 'min-width': '75rem' }"
        [rowHover]="true"
        dataKey="id"
        currentPageReportTemplate="מציג {first} עד {last} מתוך {totalRecords} תורמים"
        [showCurrentPageReport]="true"
    >
        <ng-template #caption>
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-2">
                <div class="flex flex-col gap-1">
                    <h2 class="m-0 text-2xl font-bold text-slate-800">ניהול תורמים</h2>
                    <span class="text-sm font-medium text-slate-500" *ngIf="donors">
                        {{donors.length}} תורמים רשומים במערכת
                    </span>
                </div>
                
                <p-iconfield iconPosition="left">
                    <p-inputicon class="pi pi-search text-slate-400" />
                    <input pInputText type="text" (input)="dt.filterGlobal($event.target.value, 'contains')" placeholder="חיפוש לפי שם או טלפון..." class="w-72" />
                </p-iconfield>
            </div>
        </ng-template>
        
        <ng-template #header>
            <tr>
                <th pSortableColumn="name" style="min-width:14rem">שם <p-sortIcon field="name" /></th>
                <th pSortableColumn="phoneNumber" style="min-width:10rem">טלפון <p-sortIcon field="phoneNumber" /></th>
                <th pSortableColumn="email" style="min-width:14rem">מייל <p-sortIcon field="email" /></th>
                <th style="min-width:16rem">מתנות</th>
                <th style="width: 8rem">פעולות</th>
            </tr>
        </ng-template>

        <ng-template #body let-donor>
            <tr>
                <td class="font-bold text-slate-800">{{ donor.name }}</td>
                <td>
                    <span class="flex items-center gap-2 text-slate-600">
                        <i class="pi pi-phone text-slate-400"></i> {{ donor.phoneNumber }} 
                    </span>
                </td>
                <td>
                    <span class="flex items-center gap-2 text-slate-600">
                        <i class="pi pi-envelope text-slate-400"></i> {{ donor.email }} 
                    </span>
                </td>
                <td>
                    <span class="gift-badge" *ngIf="donor.giftsString">
                        <i class="pi pi-gift"></i> 
                        {{ donor.giftsString }}
                    </span>
                </td>
                <td>
                    <div class="flex gap-2">
                        <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" severity="secondary" (click)="editDonor(donor)" />
                        <p-button [disabled]="donor.giftsString !== ''" icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteDonor(donor)" />
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-dialog [(visible)]="donorDialog" [style]="{ width: '450px' }" [header]="donor.id === 0 ? 'תורם חדש' : 'עריכת תורם'" [modal]="true" styleClass="p-fluid">
        <ng-template #content>
            <div class="flex flex-col gap-5 mt-2">
                <div>
                    <label for="name" class="block font-bold mb-2 text-slate-700">שם מלא</label>
                    <input type="text" pInputText id="name" [(ngModel)]="donor.name" required autofocus fluid />
                    <small class="text-red-500 mt-1 block" *ngIf="submitted && !donor.name">שם הוא שדה חובה.</small>
                </div>
                <div>
                    <label for="email" class="block font-bold mb-2 text-slate-700">מייל</label>
                    <input type="email" pInputText id="email" [(ngModel)]="donor.email" fluid />
                </div>
                <div>
                    <label for="phone" class="block font-bold mb-2 text-slate-700">טלפון</label>
                    <input type="text" pInputText id="phone" [(ngModel)]="donor.phoneNumber" fluid />
                </div>
            </div>
        </ng-template>
        <ng-template #footer>
            <p-button label="ביטול" icon="pi pi-times" [text]="true" severity="secondary" (click)="hideDialog()" />
            <p-button label="שמור" icon="pi pi-check" (click)="saveDonor()" />
        </ng-template>
    </p-dialog>

    <p-confirmdialog [style]="{ width: '450px' }" />
</div>
