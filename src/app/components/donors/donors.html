<div class="card p-5" dir="rtl">
    <p-toast></p-toast>

    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-5 gap-4 border-b border-slate-100 pb-4">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-indigo-50/80 text-indigo-600 flex items-center justify-center shadow-sm border border-indigo-100/50">
                <i class="pi pi-users text-2xl"></i>
            </div>
            
            <div class="flex flex-col gap-1">
                <h2 class="m-0 text-3xl font-extrabold text-slate-800 tracking-tight">ניהול תורמים</h2>
                
                <div class="flex items-center gap-2 text-sm font-medium text-slate-500">
                    <span class="flex items-center gap-1.5 bg-slate-50 px-2 py-0.5 rounded-md border border-slate-100" *ngIf="donors">
                        <i class="pi pi-user text-xs text-slate-400"></i>
                        {{donors.length}} תורמים במערכת
                    </span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <p-button (click)="exportCSV($event)" label="ייצוא" icon="pi pi-upload" [outlined]="true" severity="secondary"></p-button>
            <p-button (click)="openNew()" label="הוספת תורם" icon="pi pi-plus"
                styleClass="bg-indigo-600 border-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl shadow-md hover:shadow-lg transition-all">
            </p-button>
        </div>
    </div>

    <div class="mb-4">
        <div class="relative w-full md:w-96">
            <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input pInputText type="text" (input)="dt.filterGlobal($event.target.value, 'contains')"
                placeholder="חיפוש לפי שם או טלפון..."
                class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-xl focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition-all" />
        </div>
    </div>

    <p-table #dt [value]="donors" [columns]="cols" [rows]="10" [paginator]="true"
        [globalFilterFields]="['name', 'email', 'phoneNumber', 'giftsString']" [tableStyle]="{ 'min-width': '100%' }"
        [rowHover]="true" dataKey="id" currentPageReportTemplate="מציג {first} עד {last} מתוך {totalRecords} תורמים"
        [showCurrentPageReport]="true">
        <ng-template #header>
            <tr>
                <th field="name" pSortableColumn="name" style="min-width:14rem">שם <p-sortIcon field="name" /></th>
                <th field="phoneNumber" pSortableColumn="phoneNumber" style="min-width:10rem">טלפון <p-sortIcon
                        field="phoneNumber" /></th>
                <th field="email" pSortableColumn="email" style="min-width:14rem">מייל <p-sortIcon field="email" /></th>
                <th field="giftsString" style="min-width:16rem">מתנות</th>
                <th style="width: 8rem">פעולות</th>
            </tr>
        </ng-template>

        <ng-template #body let-donor>
            <tr>
                <td class="font-bold text-slate-800">{{ donor.name }}</td>
                <td>
                    <span class="flex items-center gap-2 text-slate-600">
                        <i class="pi pi-phone text-slate-400"></i> {{ donor.phoneNumber }}
                    </span>
                </td>
                <td>
                    <span class="flex items-center gap-2 text-slate-600">
                        <i class="pi pi-envelope text-slate-400"></i> {{ donor.email }}
                    </span>
                </td>
                 <td style="max-width: 250px;"> <span class="inline-flex items-center gap-1.5 bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg text-sm font-medium border border-indigo-100 whitespace-normal leading-relaxed" *ngIf="donor.giftsString">
        <i class="pi pi-gift"></i> 
        {{ donor.giftsString }}
    </span>
                </td>
                <td>
                    <div class="flex gap-2">
                        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true"
                            styleClass="bg-indigo-50 text-indigo-600 hover:bg-indigo-100"
                            (onClick)="editDonor(donor)"></p-button>
                        <p-button [disabled]="donor.giftsString !== ''" icon="pi pi-trash" severity="danger"
                            [rounded]="true" [text]="true"
                            styleClass="bg-red-50 text-red-600 hover:bg-red-100 disabled:bg-slate-100 disabled:text-slate-400"
                            (onClick)="deleteDonor(donor)"></p-button>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-dialog [(visible)]="donorDialog" [style]="{ width: '500px' }"
        [header]="donor.id === 0 ? 'תורם חדש' : 'עריכת תורם'" [modal]="true" styleClass="p-fluid donor-dialog">
        <div class="flex flex-col gap-5 mt-2 px-2">
            <div>
                <label for="name" class="block font-semibold mb-2 text-slate-700 text-sm">שם מלא *</label>
                <input type="text" pInputText id="name" [(ngModel)]="donor.name" required autofocus fluid 
                    class="w-full border border-slate-200 rounded-xl px-4 py-2.5 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all" />
                <small class="text-red-500 mt-1 block" *ngIf="submitted && !donor.name">שם הוא שדה חובה.</small>
            </div>
            <div>
                <label for="email" class="block font-semibold mb-2 text-slate-700 text-sm">מייל</label>
                <input type="email" pInputText id="email" [(ngModel)]="donor.email" fluid 
                    class="w-full border border-slate-200 rounded-xl px-4 py-2.5 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all" />
            </div>
            <div>
                <label for="phone" class="block font-semibold mb-2 text-slate-700 text-sm">טלפון</label>
                <input type="text" pInputText id="phone" [(ngModel)]="donor.phoneNumber" fluid 
                    class="w-full border border-slate-200 rounded-xl px-4 py-2.5 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all" />
            </div>
        </div>
        <ng-template pTemplate="footer">
            <div class="flex justify-end gap-3 pt-4">
                <p-button label="ביטול" icon="pi pi-times" [outlined]="true" severity="secondary"
                    styleClass="px-5 py-2 rounded-xl"
                    (onClick)="hideDialog()"></p-button>
                <p-button label="שמור" icon="pi pi-check" 
                    styleClass="bg-indigo-600 border-indigo-600 hover:bg-indigo-700 px-5 py-2 rounded-xl"
                    (onClick)="saveDonor()"></p-button>
            </div>
        </ng-template>
    </p-dialog>

    <p-confirmdialog [style]="{ width: '400px' }" styleClass="custom-confirm-dialog" acceptLabel="כן, מחק תורם"
        rejectLabel="לא, ביטול" acceptIcon="" rejectIcon=""
        acceptButtonStyleClass="bg-red-600 border-red-600 hover:bg-red-700 text-white font-bold px-6 py-2.5 rounded-xl shadow-sm transition-colors"
        rejectButtonStyleClass="p-button-text p-button-secondary font-bold text-slate-600 hover:bg-slate-100 px-6 py-2.5 rounded-xl transition-colors">

        <ng-template pTemplate="message" let-message>
            <div class="flex flex-col items-center text-center w-full gap-3 pt-5 pb-2">
                <div class="w-20 h-20 rounded-full bg-red-50 flex items-center justify-center mb-2">
                    <i class="pi pi-trash text-4xl text-red-500"></i>
                </div>
                <h3 class="text-2xl font-bold text-slate-800 m-0">מחיקת תורם</h3>
                <p class="text-slate-600 text-lg m-0 px-4 leading-relaxed" dir="rtl">
                    {{ message.message }}
                </p>
            </div>
        </ng-template>
    </p-confirmdialog>
</div>
